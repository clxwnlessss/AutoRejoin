# Render Blueprint: сервер аккаунтов и топа АФК для AutoRejoin (by clxwnlesss).
# Render → New → Blueprint → этот репозиторий. DATABASE_URL Render спросит при создании —
# вставь строку подключения к PostgreSQL (Neon, Supabase или Render Postgres).
services:
  - type: web
    name: autorejoin-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
      # Discord bot (Developer Portal → your app). DISCORD_TOKEN is secret — paste it only into Render.
      - key: DISCORD_APP_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
