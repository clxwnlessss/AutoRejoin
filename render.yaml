# Render Blueprint: сервер аккаунтов и топа АФК для AutoRejoin (by clxwnlesss).
# Render → New → Blueprint → этот репозиторий. DATABASE_URL Render спросит при создании —
# вставь строку подключения к PostgreSQL (Neon, Supabase или Render Postgres).
services:
  - type: web
    name: autorejoin-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
