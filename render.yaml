# Render Blueprint: сервер аккаунтов и топа АФК для AutoRejoin (by clxwnlesss).
# Render → New → Blueprint → этот репозиторий. DATABASE_URL Render спросит при создании —
# вставь строку подключения к PostgreSQL (Neon, Supabase или Render Postgres).
services:
  - type: web
    name: autorejoin-server
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
      # Discord bot (Developer Portal → your app). DISCORD_TOKEN is secret — paste it only into Render.
      - key: DISCORD_APP_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_TOKEN
        sync: false
      # Telegram bot (@BotFather → /newbot). Secret — paste it only into Render.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Email codes (link email, reset password): Brevo free plan → SMTP & API → API key. Secret — only into Render.
      - key: BREVO_API_KEY
        sync: false
      # Sender address verified in Brevo (Senders → Add a sender), e.g. your Gmail.
      - key: MAIL_FROM
        sync: false
